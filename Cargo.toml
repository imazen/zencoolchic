[package]
name = "zencoolchic"
version = "0.0.1"
edition = "2024"
rust-version = "1.89"
license = "BSD-3-Clause"
description = "Cool-chic 5 overfitted neural image codec in safe Rust"
repository = "https://github.com/imazen/zencoolchic"
keywords = ["image", "codec", "neural", "compression", "cool-chic"]
categories = ["multimedia::images", "compression"]
publish = false

[features]
default = []
std = []
# Training, quantization and bitstream writer.
encoder = ["std", "dep:rayon", "dep:enough"]
# Codec trait bridge; add encoder for the encode half.
zencodec = ["dep:zencodec", "dep:zenpixels", "dep:whereat", "dep:enough", "dep:zenpixels-convert"]
# Differential tests against checked-in upstream reference dumps.
oracle = ["std", "encoder"]

[dependencies]
archmage = { version = "0.9.30", features = ["macros"] }
libm = "0.2.16"
magetypes = "0.9.30"
rayon = { version = "1.12.0", optional = true }

zencodec = { version = ">=0.1.26, <0.3.0", optional = true }
zenpixels = { version = ">=0.2.16, <0.4.0", optional = true }
zenpixels-convert = { version = ">=0.2.16, <0.4.0", optional = true, default-features = false }
whereat = { version = "0.1.5", optional = true }
enough = { version = "0.4.5", optional = true, default-features = false }

[dev-dependencies]
zencodec-testkit = ">=0.1.0, <0.3.0"
serde_json = "1.0.154"
sha2 = { version = "0.11.1", default-features = false }
zenzstd = { git = "https://github.com/imazen/zenzstd", rev = "21ba0c294900ef8d346eaa7255a489d84fdce8f3", default-features = false, features = ["std", "hash"] }

[profile.release]
debug = 1
lto = "thin"

[lints.rust]
unsafe_code = "forbid"

[[example]]
name = "train"
required-features = ["encoder"]

[[example]]
name = "decode"
required-features = ["std"]

[[example]]
name = "exp_audit"
required-features = ["std"]

[[example]]
name = "encode"
required-features = ["encoder"]

[[example]]
name = "bench_train"
required-features = ["encoder"]

[[example]]
name = "codec_encode"
required-features = ["encoder", "zencodec"]
